name: Testes offline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Preparar ferramentas de build
        run: |
          python -m pip install setuptools==78.1.1 wheel==0.46.3
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap util-linux
      - name: Construir wheel e testar sem rede ou credenciais
        run: sudo "$(command -v python)" -B scripts/check.py
